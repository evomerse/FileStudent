[project]
name = "filestudent"
version = "0.1.0"
description = "Boite a outils desktop pour etudiants : conversion, fusion, compression, amelioration d'image et detection de texte IA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7",
    "pymupdf>=1.24",
    "pypdf>=4.0",
    "Pillow>=10.0",
    "python-docx>=1.0",
    "pdf2docx>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
build = ["pyinstaller>=6.0"]

[project.scripts]
filestudent = "filestudent.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
