name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

defaults:
  run:
    working-directory: filestudent-app

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -e ".[build]"

      - name: Construire FileStudent.exe
        run: pyinstaller filestudent.spec --noconfirm

      - name: Publier l'executable (artefact de build)
        uses: actions/upload-artifact@v4
        with:
          name: FileStudent-windows
          path: filestudent-app/dist/FileStudent.exe

      - name: Publier une release telechargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dernier-build
          name: "Dernier build (execution #${{ github.run_number }})"
          body: |
            Executable Windows genere automatiquement a chaque push sur main
            (commit ${{ github.sha }}).

            Ce n'est pas une version stable numerotee : ce lien est remplace
            a chaque nouveau push sur main.
          files: filestudent-app/dist/FileStudent.exe
